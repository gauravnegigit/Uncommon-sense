    function scanDangerSigns(text) {
      if (!text) return [];
      const lower = text.toLowerCase();
      const detected = [];
      OFFICIAL_DANGER_SIGNS.forEach(sign => {
        if (sign.keywords.some(kw => lower.includes(kw.toLowerCase()))) {
          detected.push(sign.titleEn);
        }
      });
      return Array.from(new Set(detected));
    }

      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState(null);
      const [authMsg, setAuthMsg] = useState(null);

      const [currentUser, setCurrentUser] = useState({
        name: 'Guest Patient',
        phone: '',
        email: '',
        isLoggedIn: false, // Default is GUEST
      });

      // Patient Chat History (ChatGPT Style - only for Logged In Patients)
      const [savedSessions, setSavedSessions] = useState([
        {
          id: 'sess_prev_01',
          title: '3 Days High Fever & Chills',
          date: 'Yesterday',
          messages: [
            { id: '1', sender: 'user', content: 'मुझे 3 दिन से 102 बुखार और कंपकंपी आ रही है।', timestamp: 'Yesterday' },
            { id: '2', sender: 'assistant', content: 'Patient Guidance:\nVisit your nearest PHC for Malaria/Dengue blood testing.', timestamp: 'Yesterday', severity: 'SYMPTOM_ASSESSMENT' }
          ]
        },
        {
          id: 'sess_prev_02',
          title: 'Chest Pain Emergency Check',
          date: '24 Aug',
          messages: [
            { id: '1', sender: 'user', content: 'Severe chest pain with radiating discomfort.', timestamp: '24 Aug' },
            { id: '2', sender: 'assistant', content: '🚨 EMERGENCY DETECTED: Call 108 immediately and transfer to CHC/District Hospital.', timestamp: '24 Aug', severity: 'EMERGENCY' }
          ]
        }
      ]);

      // Form fields
      const [authForm, setAuthForm] = useState({
        name: '',
        identifier: '',
        password: '',
        phone: '',
        email: '',
        address: '',
        pincode: '',
        otp: '',
      });

      // Voice & Triage State
      const [isRecording, setIsRecording] = useState(false);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const [messages, setMessages] = useState([
        {
          id: 'welcome',
          sender: 'assistant',
          content: 'नमस्ते! मैं ग्रामीण हेल्थ (Gramin Health) ट्राइएज सहायक हूँ। कृपया मरीज के लक्षण बताएं या नीचे दिए गए माइक बटन को दबाकर हिंदी में बोलें।',
          timestamp: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
          severity: 'UNKNOWN'
        }
      ]);

      const t = (key) => TRANSLATIONS[lang][key] || TRANSLATIONS['en'][key] || key;
      const isHindi = lang === 'hi';

      // --- GPS Location Detection ---
      const handleDetectGPS = () => {
        if ('geolocation' in navigator) {
          setIsLocatingGPS(true);
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const detected = {
                name: `GPS Location (${pos.coords.latitude.toFixed(3)}°N, ${pos.coords.longitude.toFixed(3)}°E)`,
                pincode: 'Auto',
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                phcsCount: 4,
                emergencyBeds: 186,
              };
              setCurrentLocation(detected);
              setIsLocatingGPS(false);
              setIsCustomLocationOpen(false);
            },
            (err) => {
              console.warn('GPS error:', err);
              alert(isHindi ? 'GPS अनुमति नहीं मिली। आप नीचे दी गई सूची से चुन सकते हैं।' : 'GPS permission not granted. You can select from regional hubs.');
              setIsLocatingGPS(false);
            }
          );
        }
      };

      // --- Text-to-Speech ---
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const clean = text.replace(/[*#_~`>]/g, '').replace(/\n+/g, '. ');
          const utt = new SpeechSynthesisUtterance(clean);
          utt.lang = isHindi ? 'hi-IN' : 'en-IN';
          utt.rate = 0.95;
          utt.onstart = () => setIsPlayingAudio(true);
          utt.onend = () => setIsPlayingAudio(false);
          utt.onerror = () => setIsPlayingAudio(false);
          window.speechSynthesis.speak(utt);
        }
      };

      const stopSpeech = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setIsPlayingAudio(false);
        }
      };

      // --- Voice Recognition ---
      const startListening = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert(isHindi ? 'इस ब्राउज़र में स्पीच रिकग्निशन समर्थित नहीं है। कृपया गूगल क्रोम का उपयोग करें।' : 'Speech recognition is not supported in this browser. Please use Google Chrome.');
          return;
        }
        stopSpeech();
        const rec = new SpeechRec();
        rec.lang = isHindi ? 'hi-IN' : 'en-IN';
        rec.continuous = false;
        rec.interimResults = false;
        rec.onstart = () => setIsRecording(true);
        rec.onresult = (e) => {
          const text = e.results[0][0].transcript;
          setIsRecording(false);
          handleSend(text);
        };
        rec.onerror = () => setIsRecording(false);
        rec.onend = () => setIsRecording(false);
        rec.start();
      };

      // --- Triage Submission ---
      const handleSend = (textToSend) => {
        const text = (textToSend || inputText).trim();
        if (!text || isLoading) return;

        stopSpeech();
        setInputText('');

        const detected = scanDangerSigns(text);
        const combinedSigns = Array.from(new Set([...dangerSigns, ...detected]));
        setDangerSigns(combinedSigns);

        const userMsg = {
          id: 'usr_' + Date.now(),
          sender: 'user',
          content: text,
          timestamp: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
        };

        const updatedMessages = [...messages, userMsg];
        setMessages(updatedMessages);
        setIsLoading(true);

        setTimeout(() => {
          let severity = 'SYMPTOM_ASSESSMENT';
          let reply = '';

          const lower = text.toLowerCase();
          if (detected.length > 0) {
            severity = 'EMERGENCY';
            reply = isHindi
              ? `🚨 आपातकालीन खतरे का संकेत (EMERGENCY DETECTED):\n\nपहचाने गए खतरे: ${detected.join(', ')}\n\nतात्कालिक कदम:\n1. तुरंत 108 एम्बुलेंस को कॉल करें।\n2. मरीज का एयरवे खुला रखें और नजदीकी 24x7 आपातकालीन सीएचसी या जिला अस्पताल रेफर करें।\n3. नीचे 'डॉक्टर रेफरल पर्ची (SBAR)' बटन दबाकर प्राप्तकर्ता डॉक्टर के लिए पर्ची तैयार करें।`
              : `🚨 EMERGENCY DANGER SIGNS DETECTED:\n\nIdentified Warning Signs: ${detected.join(', ')}\n\nImmediate Actions:\n1. Dispatch 108 Emergency Ambulance immediately.\n2. Keep airway clear and transfer to nearest 24x7 Emergency CHC or District Hospital.\n3. Click 'View Doctor Handover (SBAR)' below to print the handover slip for the medical officer.`;
          } else if (lower.includes('phc') || lower.includes('hospital') || lower.includes('अस्पताल') || lower.includes('कहाँ') || lower.includes('where is')) {
            severity = 'FACILITY_LOOKUP';
            reply = isHindi
              ? `📍 नजदीकी स्वास्थ्य केंद्र खोज (Facility Lookup):\n\nआपके क्षेत्र (${currentLocation.name}) के निकटतम प्राथमिक स्वास्थ्य केंद्र (PHC फाफामऊ - 1.2 किमी) और 24x7 सीएचसी सोरांव उपलब्ध हैं। नीचे 'नजदीकी अस्पताल/PHC' टैब में सभी विवरण और संपर्क नंबर देखें।`
              : `📍 Facility Lookup:\n\nNearest Primary Health Centre in ${currentLocation.name} is PHC Phaphamau (1.2 km) and CHC Soraon (24x7). Check the 'Nearby Facilities' tab for phone numbers and bed availability.`;
          } else {
            severity = 'SYMPTOM_ASSESSMENT';
            reply = isHindi
              ? `मरीज मार्गदर्शन (Patient Guidance):\nआपके लक्षणों का मूल्यांकन आईसीएमआर (ICMR) प्राथमिक उपचार दिशानिर्देशों के अनुसार किया गया है। आज ही अपने नजदीकी प्राथमिक स्वास्थ्य केंद्र (PHC) पर डॉक्टर द्वारा जांच एवं आवश्यक रक्त परीक्षण कराएं।\n\nफॉलो-अप प्रश्न:\nक्या मरीज को बहुत तेज बुखार, कंपकंपी या तरल पदार्थ न पी पाने की समस्या है?`
              : `Patient Guidance:\nYour symptoms have been evaluated against ICMR Primary Care Treatment Workflows. Please visit your nearest PHC Medical Officer for physical examination.\n\nFollow-up question:\nIs the patient experiencing high fever, intense chills, or inability to retain fluids?`;
          }

          const astMsg = {
            id: 'ast_' + Date.now(),
            sender: 'assistant',
            content: reply,
            timestamp: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
            severity
          };

          const finalMessages = [...updatedMessages, astMsg];
          setMessages(finalMessages);
          setIsLoading(false);

          // Save to history if patient is logged in
          if (currentUser.isLoggedIn) {
            setSavedSessions(prev => {
              const existingIdx = prev.findIndex(s => s.id === chatId);
              const titleSnippet = text.slice(0, 30) + (text.length > 30 ? '...' : '');
              if (existingIdx >= 0) {
                const copy = [...prev];
                copy[existingIdx].messages = finalMessages;
                return copy;
              } else {
                return [{ id: chatId, title: titleSnippet, date: isHindi ? 'आज' : 'Today', messages: finalMessages }, ...prev];
              }
            });
          }

          if (severity === 'EMERGENCY') {
            speakText(isHindi ? 'सावधान! आपातकालीन खतरे के संकेत मिले हैं। कृपया तुरंत 108 एम्बुलेंस बुलाएं।' : 'Alert! Emergency danger signs detected. Please call 108 immediately.');
          }
        }, 700);
      };

      const handleNewChat = () => {
        stopSpeech();
        setChatId('chat_' + Math.random().toString(36).substring(2, 10));
        setDangerSigns([]);
        setMessages([
          {
            id: 'welcome_' + Date.now(),
            sender: 'assistant',
            content: isHindi
              ? 'नमस्ते! मैं ग्रामीण हेल्थ (Gramin Health) ट्राइएज सहायक हूँ। कृपया मरीज के लक्षण बताएं या नीचे दिए गए माइक बटन को दबाकर हिंदी में बोलें।'
              : 'Hello! I am your Gramin Health Triage & Referral Assistant. Please describe patient symptoms or speak using the microphone.',
            timestamp: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
            severity: 'UNKNOWN'
          }
        ]);
      };

      const loadSavedSession = (sess) => {
        stopSpeech();
        setChatId(sess.id);
        setMessages(sess.messages);
      };

      // --- PATIENT AUTHENTICATION (Bilingual Error Feedback) ---
      
      // 1. Patient Login (Validates against backend or registered patient registry)
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);
        setAuthMsg(null);

        const enteredId = authForm.identifier.trim();
        const enteredPass = authForm.password;

        // Attempt Backend API if available
        let backendSucceeded = false;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);

          const res = await fetch('http://127.0.0.1:8000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              identifier: enteredId,
              password: enteredPass,
              role: 'PATIENT',
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            backendSucceeded = true;
            setCurrentUser({
              name: data.name || enteredId,
              phone: data.phone || enteredId,
              email: data.email || '',
              isLoggedIn: true,
            });
          } else {
            // Backend responded with explicit error (401, 400, etc.)
            setAuthError(data.detail || t('invalidUserError'));
            setAuthLoading(false);
            return;
          }
        } catch (err) {
          // Backend unreachable or offline: Validate against active patient database
          const foundUser = registeredUsers.find(
            u => (u.identifier.toLowerCase() === enteredId.toLowerCase() || u.phone === enteredId) && u.password === enteredPass
          );

          if (foundUser) {
            backendSucceeded = true;
            setCurrentUser({
              name: foundUser.name,
              phone: foundUser.phone,
              email: foundUser.identifier.includes('@') ? foundUser.identifier : '',
              isLoggedIn: true,
            });
          } else {
            // Strictly show INVALID CREDENTIALS error
            setAuthError(t('invalidUserError'));
            setAuthLoading(false);
            return;
          }
        }

        if (backendSucceeded) {
          setAuthMsg(t('loginSuccessMsg'));
          setTimeout(() => {
            setIsAuthOpen(false);
            setAuthMsg(null);
            setAuthError(null);
          }, 600);
        }
        setAuthLoading(false);
      };

      // 2. Patient Signup (Initiate)
      const handleSignupSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);
        setAuthMsg(null);

        const phone = authForm.phone.trim();
        const email = authForm.email?.trim() || '';

        // Check if user already exists
        const exists = registeredUsers.some(u => u.phone === phone || (email && u.identifier === email));
        if (exists) {
          setAuthError(t('userExistsError'));
          setAuthLoading(false);
          return;
        }

        // Try Backend API
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          const res = await fetch('http://127.0.0.1:8000/api/auth/signup/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: authForm.name.trim(),
              contact: phone,
              email: email || null,
              password: authForm.password,
              address: authForm.address?.trim() || 'Rural',
              pincode: authForm.pincode?.trim() || '211013',
              role: 'PATIENT',
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setAuthError(data.detail || t('userExistsError'));
            setAuthLoading(false);
            return;
          }
        } catch (err) {
          // Backend offline: store pending in client
        }

        setPendingSignup({
          name: authForm.name.trim(),
          phone: phone,
          email: email,
          password: authForm.password,
          generatedOtp: '123456'
        });

        setAuthMode('OTP');
        setAuthMsg(t('otpSentMsg'));
        setAuthLoading(false);
      };

      // 3. Verify OTP
      const handleOtpVerify = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);
        setAuthMsg(null);

        const enteredOtp = authForm.otp.trim();

        // Validate OTP (Must be 6 digits and match)
        if (enteredOtp !== '123456' && enteredOtp.length !== 6) {
          setAuthError(t('invalidOtpError'));
          setAuthLoading(false);
          return;
        }

        // Try Backend API
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          await fetch('http://127.0.0.1:8000/api/auth/signup/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: authForm.phone.trim(),
              phone_otp: enteredOtp,
              email: authForm.email?.trim() || null,
              email_otp: enteredOtp,
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);
        } catch (err) {
          // continue client state
        }

        // Add to active registered users
        const newUser = {
          identifier: authForm.phone.trim(),
          name: authForm.name.trim() || 'Patient',
          password: authForm.password,
          phone: authForm.phone.trim()
        };
        setRegisteredUsers(prev => [...prev, newUser]);

        setCurrentUser({
          name: newUser.name,
          phone: newUser.phone,
          email: authForm.email || '',
          isLoggedIn: true,
        });

        setAuthMsg(t('signupSuccessMsg'));
        setTimeout(() => {
          setIsAuthOpen(false);
          setAuthMsg(null);
          setAuthError(null);
        }, 600);
        setAuthLoading(false);
      };

      // 4. Logout
      const handleLogout = async () => {
        try {
          await fetch('http://127.0.0.1:8000/api/auth/logout', { method: 'POST' });
        } catch (err) {}
        setCurrentUser({
          name: 'Guest Patient',
          phone: '',
          email: '',
          isLoggedIn: false,
        });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between font-sans">
          
          {/* Top Safety Bar */}
          <div className="bg-[#0c2a21] text-emerald-100 text-xs py-1.5 px-4 border-b border-emerald-900/50">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-2 font-semibold">
                <span className="px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-300 border border-emerald-700/60 text-[10px]">
                  {t('notADoctorBadge')}
                </span>
                <span className="hidden sm:inline text-emerald-200/90 truncate">
                  {t('emergencyDisclaimer')}
                </span>
              </div>
              <a
                href="tel:108"
                className="px-2.5 py-0.5 rounded-full bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs flex items-center gap-1.5 shadow-sm animate-pulse"
              >
                <span>📞 108 {isHindi ? 'आपातकाल' : 'Emergency'}</span>
              </a>
            </div>
          </div>

          {/* Floating Pill Header */}
          <header className="sticky top-2 z-40 max-w-7xl mx-auto w-full px-4 sm:px-6 pt-2">
            <div className="bg-white/90 backdrop-blur-xl border border-slate-200/80 shadow-md shadow-emerald-950/5 rounded-full px-4 sm:px-6 py-2.5 flex items-center justify-between gap-4">
              
              {/* Clean Transparent Logo & Name */}
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 flex items-center justify-center shrink-0">
                  <img src="logo.png" alt="Gramin Health Logo" className="w-full h-full object-contain" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-lg font-black text-slate-950 tracking-tight">
                      Gramin <span className="text-emerald-600">Health</span>
                    </span>
                  </div>
                  <span className="text-[10px] font-bold text-slate-400 block -mt-0.5">
                    {t('appSubtitle')}
                  </span>
                </div>
              </div>

              {/* Center Navigation Pills */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-100/90 p-1 rounded-full border border-slate-200/60 text-xs font-extrabold">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`px-4 py-1.5 rounded-full transition-all ${
                    activeTab === 'home' ? 'bg-slate-950 text-white shadow-xs' : 'text-slate-600 hover:text-slate-950'
                  }`}
                >
                  • {t('navHome')}
                </button>
                <button
                  onClick={() => setActiveTab('triage')}
                  className={`px-4 py-1.5 rounded-full transition-all ${
                    activeTab === 'triage' ? 'bg-slate-950 text-white shadow-xs' : 'text-slate-600 hover:text-slate-950'
                  }`}
                >
                  {t('navTriage')}
                </button>
                <button
                  onClick={() => setActiveTab('facilities')}
                  className={`px-4 py-1.5 rounded-full transition-all ${
                    activeTab === 'facilities' ? 'bg-slate-950 text-white shadow-xs' : 'text-slate-600 hover:text-slate-950'
                  }`}
                >
                  {t('navFacilities')}
                </button>
              </nav>

              {/* Right Controls: Location + Language + Patient Auth & Logout */}
              <div className="flex items-center gap-2">
                
                {/* Location Track Pill */}
                <button
                  onClick={() => setIsCustomLocationOpen(true)}
                  className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-extrabold transition-all"
                  title="Click to track or change location"
                >
                  <span>📍</span>
                  <span className="max-w-[130px] truncate">{currentLocation.name}</span>
                </button>

                {/* Language Switch */}
                <div className="flex items-center bg-slate-100 rounded-full p-0.5 border border-slate-200 text-xs font-black">
                  <button
                    onClick={() => {
                      setLang('hi');
                      setAuthError(null);
                    }}
                    className={`px-2.5 py-1 rounded-full ${lang === 'hi' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-500'}`}
                  >
                    हिंदी
                  </button>
                  <button
                    onClick={() => {
                      setLang('en');
                      setAuthError(null);
                    }}
                    className={`px-2.5 py-1 rounded-full ${lang === 'en' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-500'}`}
                  >
                    EN
                  </button>
                </div>

                {/* Patient Auth Button & Logout Option */}
                {currentUser.isLoggedIn ? (
                  <div className="flex items-center gap-2">
                    <span className="hidden sm:inline text-xs font-black text-slate-800 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full">
                      👤 {currentUser.name}
                    </span>
                    <button
                      onClick={handleLogout}
                      className="px-3 py-1.5 rounded-full bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-black transition-all"
                      title={t('logout')}
                    >
                      {t('logout')}
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => {
                      setAuthError(null);
                      setAuthMsg(null);
                      setIsAuthOpen(true);
                    }}
                    className="flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-slate-950 hover:bg-slate-800 text-white text-xs font-black shadow-sm transition-all"
                  >
                    <span>{t('navAuth')}</span>
                    <span className="text-emerald-400">↗</span>
                  </button>
                )}
              </div>
            </div>
          </header>

                {/* LEFT HISTORY SIDEBAR (ONLY FOR LOGGED IN PATIENTS) */}

                  <div className="lg:col-span-3 bg-white rounded-3xl border border-slate-200/80 p-4 shadow-sm flex flex-col h-[580px]">
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                      <span className="text-xs font-black text-slate-900 flex items-center gap-1.5">
                        <span>💬</span>
                        <span>{t('chatHistory')}</span>
                      </span>
                      <button
                        onClick={handleNewChat}
                        className="px-2.5 py-1 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-extrabold shadow-xs"
                      >
                        + {isHindi ? 'नया' : 'New'}
                      </button>
                    </div>

                    {/* Chat Sessions List */}
                    <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                      {savedSessions.map((s) => (
                        <div
                          key={s.id}
                          onClick={() => loadSavedSession(s)}
                          className={`p-3 rounded-2xl cursor-pointer border transition-all text-xs flex flex-col justify-between ${
                            chatId === s.id
                              ? 'bg-emerald-50/80 border-emerald-400 text-emerald-950 font-bold shadow-xs'
                              : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                          }`}
                        >
                          <span className="line-clamp-1 font-bold text-[11px] mb-1">
                            {s.title}
                          </span>
                          <span className="text-[9px] text-slate-400">
                            🕒 {s.date}
                          </span>
                        </div>
                      ))}
                    </div>

                    {/* Patient Profile & Logout in Sidebar */}
                    <div className="pt-3 border-t border-slate-100 mt-2">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-bold text-slate-800 truncate max-w-[120px]">
                          👤 {currentUser.name}
                        </span>
                        <button
                          onClick={handleLogout}
                          className="text-[11px] font-extrabold text-red-600 hover:underline"
                        >
                          {t('logout')}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MAIN TRIAGE CONSOLE (Full width in guest mode, 9 cols when logged in) */}
                <div className={`${currentUser.isLoggedIn ? 'lg:col-span-9' : 'lg:col-span-12'} space-y-4`}>
                  
                  {/* Quick Preset Pills */}
                  <div className="flex items-center justify-between bg-white p-3 rounded-2xl border border-slate-200 text-xs">
                    <span className="font-bold text-slate-700">
                      💡 {isHindi ? 'त्वरित परिदृश्य:' : 'Quick Presets:'}
                    </span>
                    <div className="flex items-center gap-1.5 overflow-x-auto">
                      {PRESETS.map((sc) => (
                        <button
                          key={sc.id}
                          onClick={() => handleSend(isHindi ? sc.promptHi : sc.promptEn)}
                          className={`px-3 py-1 rounded-full text-[10px] font-extrabold whitespace-nowrap border ${
                            sc.expected === 'EMERGENCY' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                          }`}
                        >
                          {isHindi ? sc.titleHi : sc.titleEn}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Chat Console Card */}
                  <div className="bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col h-[520px] overflow-hidden">
                    
                    {/* Header */}
                    <div className="bg-slate-950 text-white px-5 py-3.5 flex items-center justify-between border-b border-slate-800">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 flex items-center justify-center shrink-0">
                          <img src="logo.png" alt="Gramin Health" className="w-full h-full object-contain" />
                        </div>
                        <div>
                          <h4 className="text-xs sm:text-sm font-extrabold text-white">
                            Gramin Health Triage Console
                          </h4>
                          <span className="text-[10px] text-slate-400 font-mono">
                            {currentUser.isLoggedIn ? `${isHindi ? 'लॉगिन' : 'Logged In'}: ${currentUser.name}` : (isHindi ? 'अतिथि मोड (Guest)' : 'Guest Mode')} • {currentLocation.name}
                          </span>
                        </div>
                      </div>

                      <button
                        onClick={handleNewChat}
                        className="px-3 py-1 rounded-full bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 transition-colors"
                      >
                        🔄 {t('newChat')}
                      </button>
                    </div>

                    {/* Messages Stream */}
                    <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 bg-slate-50/50">
                      {messages.map((m) => {
                        const isUser = m.sender === 'user';
                        const isEm = m.severity === 'EMERGENCY';

                        return (
                          <div key={m.id} className={`flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`}>
                            {!isUser && (
                              <div className="w-8 h-8 shrink-0 flex items-center justify-center">
                                <img src="logo.png" alt="Logo" className="w-full h-full object-contain" />
                              </div>
                            )}

                            <div className="max-w-[85%] sm:max-w-[75%] space-y-2">
                              <div className={`p-4 rounded-2xl text-xs sm:text-sm leading-relaxed shadow-xs ${
                                isUser ? 'bg-slate-950 text-white rounded-tr-none' : isEm ? 'bg-red-50 border-2 border-red-300 text-slate-900 rounded-tl-none' : 'bg-white border border-slate-200 text-slate-900 rounded-tl-none'
                              }`}>
                                {!isUser && m.severity && m.severity !== 'UNKNOWN' && (
                                  <div className="mb-2">
                                    <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase ${
                                      isEm ? 'bg-red-600 text-white' : 'bg-emerald-100 text-emerald-800'
                                    }`}>
                                      {m.severity}
                                    </span>
                                  </div>
                                )}

                                <div className="whitespace-pre-wrap font-sans">
                                  {m.content}
                                </div>

                                <div className="flex items-center justify-between gap-2 mt-2 pt-2 border-t border-slate-100 text-[10px] text-slate-400">
                                  <span>{m.timestamp}</span>
                                  {!isUser && (
                                    <button
                                      onClick={() => speakText(m.content)}
                                      className="text-emerald-700 font-extrabold hover:underline flex items-center gap-1"
                                    >
                                      🔊 <span>{isHindi ? 'आवाज में सुनें' : 'Listen'}</span>
                                    </button>
                                  )}
                                </div>
                              </div>

                              {/* Action Buttons */}
                              {!isUser && isEm && (
                                <div className="flex flex-wrap gap-2">
                                  <a href="tel:108" className="px-3.5 py-1.5 rounded-full bg-red-600 text-white text-xs font-extrabold">
                                    📞 108 {isHindi ? 'कॉल करें' : 'Call'}
                                  </a>
                                  <button onClick={() => setIsDoctorModalOpen(true)} className="px-3.5 py-1.5 rounded-full bg-slate-950 text-white text-xs font-bold">
                                    📋 {t('viewDoctorSummary')}
                                  </button>
                                  <button onClick={() => setActiveTab('facilities')} className="px-3.5 py-1.5 rounded-full bg-white border border-red-300 text-red-700 text-xs font-bold">
                                    📍 {isHindi ? 'नजदीकी अस्पताल' : 'Nearby Facilities'}
                                  </button>
                                </div>
                              )}

                              {!isUser && m.severity === 'SYMPTOM_ASSESSMENT' && (
                                <div className="flex flex-wrap gap-2">
                                  <button onClick={() => setIsDoctorModalOpen(true)} className="px-3.5 py-1.5 rounded-full bg-slate-950 text-white text-xs font-bold">
                                    📋 {t('viewDoctorSummary')}
                                  </button>
                                  <button onClick={() => setActiveTab('facilities')} className="px-3.5 py-1.5 rounded-full bg-white border border-emerald-300 text-emerald-800 text-xs font-bold">
                                    📍 {isHindi ? 'नजदीकी PHC' : 'Nearby PHC'}
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}

                      {isLoading && (
                        <div className="flex items-center gap-2 text-xs text-slate-500 font-bold p-2 bg-white rounded-xl border border-slate-200 w-fit">
                          <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                          <span>{isHindi ? 'ASHA आपातकालीन नियमों का विश्लेषण हो रहा है...' : 'Evaluating against triage guidelines...'}</span>
                        </div>
                      )}
                    </div>

                    {/* Input Controls */}
                    <div className="p-4 bg-white border-t border-slate-200 space-y-3">
                      {/* Glowing Voice Button */}
                      <div className="flex items-center gap-3">
                        <button
                          onClick={isRecording ? () => setIsRecording(false) : startListening}
                          className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-full font-black text-xs sm:text-sm text-white shadow-md transition-all ${
                            isRecording
                              ? 'bg-red-600 animate-pulse-glow'
                              : 'bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-500 hover:to-teal-600 shadow-emerald-500/20'
                          }`}
                        >
                          <span>{isRecording ? '⏹️ ' + t('stopRecording') : '🎙️ ' + t('speakInHindi')}</span>
                        </button>

                        {isPlayingAudio && (
                          <button
                            onClick={stopSpeech}
                            className="px-4 py-3 rounded-full bg-red-100 text-red-700 font-extrabold text-xs"
                          >
                            🔇 Stop
                          </button>
                        )}
                      </div>

                      {/* Text Input */}
                      <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="flex items-center gap-2">
                        <input
                          type="text"
                          value={inputText}
                          onChange={(e) => setInputText(e.target.value)}
                          placeholder={t('inputPlaceholder')}
                          className="flex-1 px-4 py-3 rounded-full bg-slate-100 border border-slate-200 text-xs sm:text-sm text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500 font-sans"
                        />
                        <button
                          type="submit"
                          disabled={!inputText.trim() || isLoading}
                          className={`px-5 py-3 rounded-full text-white font-extrabold text-xs sm:text-sm ${
                            !inputText.trim() ? 'bg-slate-300 cursor-not-allowed' : 'bg-slate-950 hover:bg-slate-800 shadow-sm'
                          }`}
                        >
                          ➤
                        </button>
                      </form>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* TAB: NEARBY FACILITIES */}
            {activeTab === 'facilities' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-xs">
                  <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6">
                    <div>
                      <h3 className="text-lg font-black text-slate-900">
                        📍 {t('facilitySearchTitle')} ({currentLocation.name})
                      </h3>
                      <p className="text-xs text-slate-500 font-hindi">
                        {isHindi ? 'प्राथमिक स्वास्थ्य केंद्र (PHC), सीएचसी और 24x7 आपातकालीन अस्पताल' : 'Nearby Primary Health Centres, CHCs, and 24x7 Emergency Hospitals'}
                      </p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setIsCustomLocationOpen(true)}
                        className="px-3.5 py-1.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold"
                      >
                        📍 {currentLocation.name}
                      </button>
                      <a
                        href="tel:108"
                        className="px-4 py-1.5 rounded-full bg-red-600 text-white text-xs font-black flex items-center gap-1"
                      >
                        📞 108
                      </a>
                    </div>
                  </div>

                  {/* Facilities Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {HEALTH_FACILITIES.map((fac) => (
                      <div key={fac.id} className="p-4 rounded-3xl border border-slate-200 bg-white hover:border-emerald-400 hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-slate-100 text-slate-800">
                              {fac.type}
                            </span>
                            {fac.emergency ? (
                              <span className="px-2 py-0.5 rounded-full bg-red-100 text-red-700 text-[10px] font-black">
                                24x7 Emergency
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px]">
                                OPD 9AM - 4PM
                              </span>
                            )}
                          </div>

                          <h4 className="text-sm font-black text-slate-900 mb-1">
                            {fac.name}
                          </h4>

                          <div className="flex items-center gap-3 text-xs text-slate-600 mb-2">
                            <span className="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">
                              📍 {fac.distance} km
                            </span>
                            {fac.beds > 0 && (
                              <span>🛏️ {fac.beds} Beds</span>
                            )}
                          </div>

                          <div className="flex flex-wrap gap-1">
                            {fac.specialties.map((s, i) => (
                              <span key={i} className="px-2 py-0.5 rounded-full bg-slate-100 text-[10px] text-slate-600">
                                {s}
                              </span>
                            ))}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2">
                          <a
                            href={`tel:${fac.phone}`}
                            className="flex-1 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold text-center"
                          >
                            📞 {t('callNow')}
                          </a>
                          <a
                            href={`https://www.google.com/maps/dir/?api=1&destination=${fac.coords[1]},${fac.coords[0]}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-3.5 py-2.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                          >
                            🗺️ {t('getDirections')}
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* SBAR DOCTOR REFERRAL SLIP MODAL */}
          {isDoctorModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden my-6">
                <div className="bg-slate-950 text-white px-6 py-4 flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 flex items-center justify-center">
                      <img src="logo.png" alt="Gramin Health" className="w-full h-full object-contain" />
                    </div>
                    <div>
                      <h3 className="text-sm sm:text-base font-black text-white">
                        {t('referralSlipTitle')} (SBAR)
                      </h3>
                      <p className="text-[11px] text-slate-400">
                        Gramin Health Clinical Handover Note for Medical Officer
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setIsDoctorModalOpen(false)} className="text-slate-400 hover:text-white p-1 text-sm font-bold">
                    ✕
                  </button>
                </div>

                <div className="p-6 overflow-y-auto bg-slate-50">
                  <div id="printable-referral-slip" className="bg-white p-6 rounded-2xl border-2 border-slate-300 text-xs space-y-4 shadow-sm">
                    {/* Header */}
                    <div className="flex items-start justify-between border-b-2 border-slate-900 pb-3">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 flex items-center justify-center">
                          <img src="logo.png" alt="Logo" className="w-full h-full object-contain" />
                        </div>
                        <div>
                          <h2 className="text-base font-black uppercase text-slate-900">
                            Gramin Health • NHM Clinical Referral Slip
                          </h2>
                          <p className="text-[11px] text-slate-600">
                            SBAR Emergency Handover Note • Primary & Emergency Care
                          </p>
                        </div>
                      </div>
                      <span className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase border ${
                        dangerSigns.length > 0 ? 'bg-red-50 text-red-700 border-red-600' : 'bg-emerald-50 text-emerald-800 border-emerald-600'
                      }`}>
                        TRIAGE: {dangerSigns.length > 0 ? 'RED (EMERGENCY)' : 'YELLOW (ROUTINE)'}
                      </span>
                    </div>

                    {/* Metadata */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[9px] uppercase font-bold">{isHindi ? 'मरीज' : 'Patient'}</span>
                        <span className="font-bold text-slate-800">{currentUser.name}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[9px] uppercase font-bold">{isHindi ? 'दिनांक व समय' : 'Date & Time'}</span>
                        <span className="font-bold text-slate-800">{new Date().toLocaleString('en-IN')}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[9px] uppercase font-bold">{isHindi ? 'रेफरल स्रोत' : 'Referred By'}</span>
                        <span className="font-bold text-slate-800">Gramin Health Assistant</span>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[9px] uppercase font-bold">{isHindi ? 'प्राप्तकर्ता केंद्र' : 'Target Center'}</span>
                        <span className="font-bold text-emerald-800">CHC / District Hospital</span>
                      </div>
                    </div>

                    {/* SBAR Sections */}
                    <div className="space-y-3 leading-relaxed">
                      <div className="p-3 bg-red-50/50 rounded-xl border border-red-200">
                        <span className="font-black text-red-800 uppercase block mb-0.5 text-[11px]">
                          S • Situation (Presenting Complaint)
                        </span>
                        <p className="text-slate-800">
                          {messages.filter(m => m.sender === 'user').map(m => m.content).join(' | ') || 'Patient reporting acute symptoms during field consultation.'}
                        </p>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <span className="font-black text-indigo-800 uppercase block mb-0.5 text-[11px]">
                          B • Background (Timeline & History)
                        </span>
                        <p className="text-slate-800">
                          Field evaluation conducted via Gramin Health multilingual voice triage assistant at {currentLocation.name}.
                        </p>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <span className="font-black text-amber-800 uppercase block mb-0.5 text-[11px]">
                          A • Assessment (Triage & Danger Signs)
                        </span>
                        <p className="text-slate-800">
                          {dangerSigns.length > 0
                            ? `Active warning signs detected: ${dangerSigns.join(', ')}. High risk of deterioration without clinical intervention.`
                            : 'No acute red-flag respiratory or circulatory compromise detected. Patient requires MO physical examination.'}
                        </p>
                      </div>

                      <div className="p-3 bg-emerald-50/50 rounded-xl border border-emerald-200">
                        <span className="font-black text-emerald-800 uppercase block mb-0.5 text-[11px]">
                          R • Recommendation (Immediate Action)
                        </span>
                        <p className="text-slate-800">
                          {dangerSigns.length > 0
                            ? '1. Dispatch 108 Emergency Ambulance immediately.\n2. Transfer to 24x7 CHC/District Hospital emergency room.'
                            : '1. Visit nearest Primary Health Centre (PHC) Medical Officer for clinical examination.'}
                        </p>
                      </div>
                    </div>

                    {/* Signatures */}
                    <div className="pt-3 border-t border-slate-200 flex justify-between text-[10px] text-slate-500">
                      <div>
                        <span>Patient Signature: __________________</span>
                      </div>
                      <div>
                        <span>Doctor Signature: __________________</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-white px-6 py-3 border-t border-slate-200 flex items-center justify-end gap-2">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold"
                  >
                    🖨️ {t('printReferral')}
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="px-5 py-2 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm"
                  >
                    📥 {t('downloadPdf')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 flex items-center justify-center">
                  <img src="logo.png" alt="Gramin Health" className="w-full h-full object-contain" />
                </div>
                <span className="font-extrabold text-white">Gramin Health (ग्रामीण हेल्थ)</span>
              </div>
              <p className="text-slate-400 text-center sm:text-right font-hindi text-[11px]">
                {t('emergencyDisclaimer')}
              </p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
